<!-- hero-section.component.html -->
<app-banner></app-banner>
<section class="hero-section d-flex align-items-center">
  <div class="container-fluid p-5">
    <div class="row align-items-center">
      <!-- Left Content -->
      <div class="col-lg-6 col-md-12 mb-3 text-left">
        <h1 class="display-4">Arya’s BMS & Industrial Training Institute</h1>
        <p class="lead mt-3">
          At Arya’s BMS & Industrial Automation Training Institute, we
          specialize in providing top-quality training in Building Management
          Systems (BMS) and Industrial Automation, along with placement
          opportunities across India and abroad.
        </p>
        <div class="mt-4">
          <a href="https://wa.me/9631412334" target="_blank">
            <button class="btn button1 me-3">Enroll Now</button>
          </a>
          <a href="tel:9631412334">
            <button class="btn button2">
              <i class="bi bi-telephone-fill"></i> Call us now!
            </button>
          </a>
          <!-- <button class="btn button2"><i class="bi bi-telephone-fill"></i> Call us now! </button> -->
        </div>
      </div>

      <!-- Right Image -->
      <div class="col-lg-6 col-md-12 text-center">
        <iframe
          #videoIframe
          [src]="videoUrl"
          width="100%"
          height="400"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        >
        </iframe>
      </div>
    </div>
  </div>
</section>
